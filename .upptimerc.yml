# Upptime config for PowerBrowser. The sites are exactly the targets Deocracy/powerbrowser derives
# from configuration.toml (.github/upptime-targets.json); scripts/verify-upptime.mjs --live checks it.
owner: Deocracy
repo: powerbrowser-status

sites:
  - name: Website
    url: https://powerbrowser.org/
  # The client asks for the eleven-segment path; this bare path 404s on a healthy Pages host,
  # while an outage answers 5xx or 522.
  - name: Update host
    url: https://updates.powerbrowser.org/update.xml
    expectedStatusCodes:
      - 404
  # The events endpoint takes POST only; a GET on a healthy Worker answers 405.
  - name: Events endpoint
    url: https://events.powerbrowser.org/events
    expectedStatusCodes:
      - 405

status-website:
  cname: status.powerbrowser.org
  name: PowerBrowser status
  introTitle: "PowerBrowser service status"
  introMessage: "Availability of the PowerBrowser website, update host and error-report endpoint."
  navbar:
    - title: Status
      href: /
    - title: PowerBrowser
      href: https://powerbrowser.org/
